name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements-ci.txt
            requirements-test.txt
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match package version {expected!r}")
          PY
      - name: Bootstrap audited packaging tools
        run: |
          python -m pip install --disable-pip-version-check --upgrade -r requirements-bootstrap.txt
          python -c "import importlib.metadata as m; assert m.version('pip') == '26.1.2'"
      - name: Install release dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify audited toolchain environment
        run: |
          python -m pip check
          python -m pip_audit --local --skip-editable --progress-spinner off --strict
      - name: Install project
        run: python -m pip install --disable-pip-version-check .
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($file in @('.commands-wrapper/install.ps1', '.commands-wrapper/uninstall.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) > $null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count) {
            $allErrors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Verify source
        run: |
          bash -n .commands-wrapper/install.sh .commands-wrapper/uninstall.sh
          shellcheck -x -S warning .commands-wrapper/install.sh .commands-wrapper/uninstall.sh
          python -m py_compile .commands-wrapper/commands-wrapper scripts/build_release.py scripts/check_coverage.py tests/test_commands_wrapper.py tests/test_build_release.py tests/test_production_paths.py tests/test_check_coverage.py
          ruff check .commands-wrapper/commands-wrapper scripts tests
          mypy .commands-wrapper/commands-wrapper scripts/build_release.py scripts/check_coverage.py
          bandit -q -c pyproject.toml -r .commands-wrapper/commands-wrapper scripts
          coverage run -m pytest
          coverage report
          coverage json -o coverage.json
          python scripts/check_coverage.py coverage.json --min-statements 85 --min-branches 75
          python -m pip check
          python -m pip_audit --local --skip-editable --progress-spinner off
          python -m pip_audit . --progress-spinner off --strict
      - name: Build distributions
        run: python scripts/build_release.py
      - name: Validate distributions
        run: twine check dist/*
      - name: Verify reproducible distributions
        run: |
          cp -a dist /tmp/commands-wrapper-first-dist
          python scripts/build_release.py --output-dir dist-recheck
          for artifact in /tmp/commands-wrapper-first-dist/*; do
            cmp "$artifact" "dist-recheck/${artifact##*/}"
          done
          rm -rf dist-recheck
      - name: Assemble release assets
        run: |
          mkdir release-assets
          cp dist/* release-assets/
          cp .commands-wrapper/install.sh release-assets/install.sh
          cp .commands-wrapper/install.ps1 release-assets/install.ps1
          cp .commands-wrapper/uninstall.sh release-assets/uninstall.sh
          cp .commands-wrapper/uninstall.ps1 release-assets/uninstall.ps1
          (cd release-assets && sha256sum commands_wrapper-* install.* uninstall.* > SHA256SUMS)
      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
      - name: Upload release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/commands-wrapper
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@2834a314042ef964da07689278dd1e9d773e8afd # v1.14.1

  github-release:
    name: Create GitHub release
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-assets
          path: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
