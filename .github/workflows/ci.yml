name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements-ci.txt
            requirements-test.txt
      - name: Bootstrap audited packaging tools
        run: |
          python -m pip install --disable-pip-version-check --upgrade -r requirements-bootstrap.txt
          python -c "import importlib.metadata as m; assert m.version('pip') == '26.1.2'"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify audited toolchain environment
        run: |
          python -m pip check
          python -m pip_audit --local --skip-editable --progress-spinner off --strict
      - name: Install project
        run: python -m pip install --disable-pip-version-check .
      - name: Compile Python sources
        run: python -m py_compile .commands-wrapper/commands-wrapper scripts/build_release.py scripts/check_coverage.py tests/test_commands_wrapper.py tests/test_build_release.py tests/test_production_paths.py tests/test_check_coverage.py
      - name: Run tests
        run: python -m pytest

  quality:
    name: Quality and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements-ci.txt
            requirements-test.txt
      - name: Bootstrap audited packaging tools
        run: |
          python -m pip install --disable-pip-version-check --upgrade -r requirements-bootstrap.txt
          python -c "import importlib.metadata as m; assert m.version('pip') == '26.1.2'"
      - name: Install quality dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify audited toolchain environment
        run: |
          python -m pip check
          python -m pip_audit --local --skip-editable --progress-spinner off --strict
      - name: Install project
        run: python -m pip install --disable-pip-version-check .
      - name: Shell syntax
        run: bash -n .commands-wrapper/install.sh .commands-wrapper/uninstall.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Shell lint
        run: shellcheck -x -S warning .commands-wrapper/install.sh .commands-wrapper/uninstall.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($file in @('.commands-wrapper/install.ps1', '.commands-wrapper/uninstall.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) > $null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count) {
            $allErrors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Compile Python sources
        run: python -m py_compile .commands-wrapper/commands-wrapper scripts/build_release.py scripts/check_coverage.py tests/test_commands_wrapper.py tests/test_build_release.py tests/test_production_paths.py tests/test_check_coverage.py
      - name: Lint
        run: ruff check .commands-wrapper/commands-wrapper scripts tests
      - name: Type check
        run: mypy .commands-wrapper/commands-wrapper scripts/build_release.py scripts/check_coverage.py
      - name: Security scan
        run: bandit -q -c pyproject.toml -r .commands-wrapper/commands-wrapper scripts
      - name: Test with coverage
        run: |
          coverage run -m pytest
          coverage report
          coverage json -o coverage.json
          python scripts/check_coverage.py coverage.json --min-statements 85 --min-branches 75
      - name: Audit installed environment and runtime dependencies
        run: |
          python -m pip check
          python -m pip_audit --local --skip-editable --progress-spinner off
          python -m pip_audit . --progress-spinner off --strict
      - name: Build distributions
        run: python scripts/build_release.py
      - name: Validate distributions
        run: twine check dist/*
      - name: Verify reproducible distributions
        run: |
          cp -a dist /tmp/commands-wrapper-first-dist
          python scripts/build_release.py --output-dir dist-recheck
          for artifact in /tmp/commands-wrapper-first-dist/*; do
            cmp "$artifact" "dist-recheck/${artifact##*/}"
          done
          rm -rf dist-recheck
      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
