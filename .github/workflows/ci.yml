name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements-ci.txt
            requirements-test.txt
      - name: Bootstrap audited packaging tools
        run: |
          python -m pip install --disable-pip-version-check --upgrade -r requirements-bootstrap.txt
          python -c "import importlib.metadata as m; assert m.version('pip') == '26.1.2'"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify audited toolchain environment
        run: |
          python -m pip check
          python -m pip_audit --local --skip-editable --progress-spinner off --strict
      - name: Install project
        run: python -m pip install --disable-pip-version-check .
      - name: Compile Python sources
        run: python -m py_compile .commands-wrapper/commands-wrapper scripts/build_release.py scripts/check_coverage.py tests/test_commands_wrapper.py tests/test_build_release.py tests/test_production_paths.py tests/test_check_coverage.py
      - name: Run tests
        run: python -m pytest

  installer-posix:
    name: POSIX installer lifecycle / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements-ci.txt
            requirements-test.txt
      - name: Install and audit controlled toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m pip check
          python -m pip_audit --local --skip-editable --progress-spinner off --strict
      - name: Exercise install and uninstall lifecycle
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/commands-wrapper-home"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/commands-wrapper-xdg"
          export TMPDIR="$RUNNER_TEMP/commands-wrapper-tmp"
          export SHELL=/bin/bash
          export CI=1
          export COMMANDS_WRAPPER_COLOR=never
          export COMMANDS_WRAPPER_DISABLE_FIRST_LAUNCH_TIP=1
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$TMPDIR"

          bash .commands-wrapper/install.sh
          scripts_dir="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts", scheme="posix_user"))')"
          cli="$scripts_dir/commands-wrapper"
          test -x "$cli"
          "$cli" --help >/dev/null
          "$scripts_dir/cw" list >/dev/null
          cat <<'YAML' | "$cli" add --yaml >/dev/null
          smoke-command:
            description: installer lifecycle
            steps:
              - command: "python -c \"print('installer-smoke')\""
          YAML
          test -x "$scripts_dir/smoke-command"
          "$scripts_dir/smoke-command" | grep -q installer-smoke

          COMMANDS_WRAPPER_UNINSTALL_FORCE=1 COMMANDS_WRAPPER_REMOVE_CONFIG=1 \
            bash .commands-wrapper/uninstall.sh
          if python -m pip show commands-wrapper >/dev/null 2>&1; then
            echo "commands-wrapper remained installed" >&2
            exit 1
          fi
          for wrapper in commands-wrapper command-wrapper cw smoke-command; do
            test ! -e "$scripts_dir/$wrapper"
          done

  installer-windows:
    name: Native Windows installer lifecycle
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements-ci.txt
            requirements-test.txt
      - name: Install and audit controlled toolchain
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ci.txt
          python -m pip check
          python -m pip_audit --local --skip-editable --progress-spinner off --strict
      - name: Exercise install and uninstall lifecycle
        shell: pwsh
        run: |
          $homeDir = Join-Path $env:RUNNER_TEMP "commands-wrapper-home"
          $appData = Join-Path $homeDir "AppData/Roaming"
          $localAppData = Join-Path $homeDir "AppData/Local"
          New-Item -ItemType Directory -Force -Path $homeDir, $appData, $localAppData | Out-Null
          $env:HOME = $homeDir
          $env:USERPROFILE = $homeDir
          $env:APPDATA = $appData
          $env:LOCALAPPDATA = $localAppData
          $env:CI = "1"
          $env:COMMANDS_WRAPPER_COLOR = "never"
          $env:COMMANDS_WRAPPER_DISABLE_FIRST_LAUNCH_TIP = "1"

          & ./.commands-wrapper/install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $scriptsDir = py -3 -c "import sysconfig; print(sysconfig.get_path('scripts', scheme='nt_user'))"
          if ($LASTEXITCODE -ne 0 -or -not $scriptsDir) { throw "failed to resolve user scripts directory" }
          $cli = @(
            (Join-Path $scriptsDir "commands-wrapper.exe"),
            (Join-Path $scriptsDir "commands-wrapper")
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cli) { throw "installed command was not found in $scriptsDir" }
          & $cli --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $yaml = @'
          smoke-command:
            description: installer lifecycle
            steps:
              - command: "python -c \"print('installer-smoke')\""
          '@
          $yaml | & $cli add --yaml | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $smokeWrapper = Join-Path $scriptsDir "smoke-command.cmd"
          if (-not (Test-Path $smokeWrapper)) { throw "generated wrapper was not found" }
          $smokeOutput = & $smokeWrapper
          if ($LASTEXITCODE -ne 0 -or $smokeOutput -notcontains "installer-smoke") {
            throw "generated wrapper failed"
          }

          $env:COMMANDS_WRAPPER_UNINSTALL_FORCE = "1"
          $env:COMMANDS_WRAPPER_REMOVE_CONFIG = "1"
          & ./.commands-wrapper/uninstall.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -m pip show commands-wrapper *> $null
          if ($LASTEXITCODE -eq 0) { throw "commands-wrapper remained installed" }
          foreach ($name in @("commands-wrapper.exe", "cw.cmd", "cw.ps1", "smoke-command.cmd", "smoke-command.ps1")) {
            if (Test-Path (Join-Path $scriptsDir $name)) { throw "$name remained after uninstall" }
          }

  quality:
    name: Quality and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            requirements-ci.txt
            requirements-test.txt
      - name: Bootstrap audited packaging tools
        run: |
          python -m pip install --disable-pip-version-check --upgrade -r requirements-bootstrap.txt
          python -c "import importlib.metadata as m; assert m.version('pip') == '26.1.2'"
      - name: Install quality dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Verify audited toolchain environment
        run: |
          python -m pip check
          python -m pip_audit --local --skip-editable --progress-spinner off --strict
      - name: Install project
        run: python -m pip install --disable-pip-version-check .
      - name: Shell syntax
        run: bash -n .commands-wrapper/install.sh .commands-wrapper/uninstall.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Shell lint
        run: shellcheck -x -S warning .commands-wrapper/install.sh .commands-wrapper/uninstall.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($file in @('.commands-wrapper/install.ps1', '.commands-wrapper/uninstall.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) > $null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count) {
            $allErrors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Compile Python sources
        run: python -m py_compile .commands-wrapper/commands-wrapper scripts/build_release.py scripts/check_coverage.py tests/test_commands_wrapper.py tests/test_build_release.py tests/test_production_paths.py tests/test_check_coverage.py
      - name: Lint
        run: ruff check .commands-wrapper/commands-wrapper scripts tests
      - name: Type check
        run: mypy .commands-wrapper/commands-wrapper scripts/build_release.py scripts/check_coverage.py
      - name: Security scan
        run: bandit -q -c pyproject.toml -r .commands-wrapper/commands-wrapper scripts
      - name: Test with coverage
        run: |
          coverage run -m pytest
          coverage report
          coverage json -o coverage.json
          python scripts/check_coverage.py coverage.json --min-statements 85 --min-branches 75
      - name: Audit installed environment and runtime dependencies
        run: |
          python -m pip check
          python -m pip_audit --local --skip-editable --progress-spinner off
          python -m pip_audit . --progress-spinner off --strict
      - name: Build distributions
        run: python scripts/build_release.py
      - name: Validate distributions
        run: twine check dist/*
      - name: Verify reproducible distributions
        run: |
          cp -a dist /tmp/commands-wrapper-first-dist
          python scripts/build_release.py --output-dir dist-recheck
          for artifact in /tmp/commands-wrapper-first-dist/*; do
            cmp "$artifact" "dist-recheck/${artifact##*/}"
          done
          rm -rf dist-recheck
      - name: Upload distributions
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
